name: Reusable frontend checks
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      working-directory:
        type: string
        default: '.'
      run-lint:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ format('{0}/package-lock.json', inputs.working-directory) }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: inputs.run-lint
        run: npm run lint
      - name: Build
        if: inputs.run-build
        run: npm run build
